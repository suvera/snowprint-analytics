# Throwaway PostgreSQL for tests/helm-e2e.sh only (stands in for "your PostgreSQL").
apiVersion: v1
kind: Namespace
metadata: { name: db }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: db }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env: [{ name: POSTGRES_PASSWORD, value: e2e-admin }]
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -h, 127.0.0.1, -U, postgres] }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: db }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]

# Publishes the Snowprint image to Docker Hub (SP-043, decision D6) when a
# version tag is pushed, e.g. v0.1.0. See docs/releasing.md.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; the
# repository variable DOCKERHUB_IMAGE overrides the image (default suvera/snowprint).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'suvera/snowprint' }}

jobs:
  verify:
    name: Check versions and run the documented install
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, application.yml and Chart.yaml agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(awk '/^winter:/{w=1} w && /^  application:/{a=1} a && /^    version:/{print $2; exit}' config/application.yml)"
          chart="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/Chart.yaml)"
          echo "tag=$tag application.yml=$app Chart.yaml appVersion=$chart"
          if [ "$tag" != "$app" ] || [ "$tag" != "$chart" ]; then
            echo "::error::the tag, winter.application.version and appVersion must be the same"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: tests/e2e.sh
        run: tests/e2e.sh

  image:
    name: Build ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker build . -f docker/Dockerfile \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=MIT" \
            -t "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    name: Publish ${{ needs.verify.outputs.version }}
    needs: [verify, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Multi-arch tags
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tags="-t $IMAGE:$VERSION"
          # Pre-releases (0.2.0-rc.1) get only their own tag; releases also move X.Y and latest.
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags -t $IMAGE:${VERSION%.*} -t $IMAGE:latest" ;;
          esac
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

{{- if not .Values.database.existingSecret }}
{{- $password := required "set database.password or database.existingSecret" .Values.database.password }}
# Database password. A pre-install/pre-upgrade hook so it exists before the
# migration Job runs (hooks are not removed by helm uninstall).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "snowprint.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowprint.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}

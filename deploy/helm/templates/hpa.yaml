{{- if and (eq .Values.mode "split") .Values.split.ingest.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "snowprint.fullname" . }}-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowprint.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "snowprint.fullname" . }}-ingest
  minReplicas: {{ .Values.split.ingest.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.split.ingest.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.split.ingest.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

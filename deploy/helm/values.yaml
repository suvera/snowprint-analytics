# Default values for the Snowprint chart. Do not edit this file for an
# installation: put your settings in deploy/values.local.yaml (git-ignored,
# start from deploy/values.example.yaml) and run deploy/deploy.sh.

image:
  repository: suvera/snowprint
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# single: one Deployment runs every role (web, ingest, worker).
# split:  one Deployment per role; scale each on its own (PRD §9.0).
mode: single

single:
  replicas: 1

split:
  web:
    replicas: 2
  ingest:
    replicas: 2
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  # Scheduled jobs (sessionizer, partitions, salt expiry) are safe on several
  # replicas: they use PostgreSQL advisory locks or are idempotent.
  worker:
    replicas: 1

# Your PostgreSQL 15+ (Snowprint does not install one). Create the role and
# database first (see docs/deploy-helm.md).
database:
  # PDO DSN, e.g. "pgsql:host=postgres.db.svc.cluster.local;port=5432;dbname=snowprint"
  url: ""
  user: snowprint
  # Either name an existing Secret holding the password ...
  existingSecret: ""
  existingSecretPasswordKey: password
  # ... or let the chart create one from this value (keep it out of git).
  password: ""

# Public base URL that tracked websites load /snow.js from and send events to,
# e.g. https://stats.example.com. Shown in the dashboard's tracking snippet.
# Empty: the dashboard's own address. When its host differs from ingress.host,
# the Ingress also routes that host (tracker paths only: /snow.js, /api/event).
publicUrl: ""

# Behind an ingress or Cloudflare Tunnel the client IP arrives in a header
# (CF-Connecting-IP, X-Forwarded-For or X-Real-IP, in that order of preference).
trustProxy: true
# Mark the dashboard session cookie Secure (serve the dashboard over HTTPS).
secureCookies: true
# Drop visits from browsers that send "DNT: 1".
respectDnt: true

# DEBUGGING ONLY: log each tracker request's client IP and proxy headers.
# Raw IPs in logs break the privacy promise; keep it off in production.
logClientIp: false

# Log one TRACE line per request (method, path, status, duration).
requestTrace: false
# Indent JSON API responses.
jsonPrettyPrint: false

# Countries, regions and cities need a GeoIP database. Either:
#  - download: dbip-city-lite (~60 MB) or dbip-country-lite (~8 MB): fetched from
#    DB-IP (free, CC BY 4.0, credited in the dashboard) when each pod starts, or
#  - existingClaim: a PVC holding your own .mmdb (DB-IP or MaxMind GeoLite2).
geoip:
  download: ""
  downloadBaseUrl: ""        # mirror of https://download.db-ip.com/free
  existingClaim: ""
  file: dbip-city-lite.mmdb

# Run database migrations in a Job before every install and upgrade.
migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: stats.example.com
  tls:
    enabled: false
    secretName: snowprint-tls

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

# Extra environment variables for every Snowprint container.
extraEnv: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
